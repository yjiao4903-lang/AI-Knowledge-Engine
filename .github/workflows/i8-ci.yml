name: Research OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'i8/**'
      - 'p1/**'
      - 'dl/**'

permissions:
  contents: read

jobs:
  backend-contracts:
    name: Backend hosted-safe coverage
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install hosted-safe test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1.0" "pydantic>=2.7" "pydantic-settings>=2.3" "PyYAML>=6.0" "pytest>=8.0" "pytest-timeout>=2.3" "httpx>=0.27" "jieba>=0.42" "markdown-it-py>=3.0" "qdrant-client>=1.12"
      - name: Compile backend modules
        working-directory: backend
        run: python -m compileall -q app
      - name: Run hosted-safe backend coverage
        working-directory: backend
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: DL-06D return-candidate action policy
        run: npm run test:dl06d
      - run: npm run build

  powershell-syntax:
    name: Runtime PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all runtime scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path runtime -Filter *.ps1 -File
          if (-not $files) { throw 'No runtime PowerShell scripts found' }
          foreach ($file in $files) {
            Write-Host "Parsing $($file.FullName)"
            [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 $file.FullName))
          }
