name: Research OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'i8/**'
      - 'p1/**'
      - 'dl/**'

permissions:
  contents: read

jobs:
  backend-contracts:
    name: Backend contracts and retrieval regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install lightweight test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1.0" "pydantic>=2.7" "PyYAML>=6.0" "pytest>=8.0" "httpx>=0.27" "jieba>=0.42"
      - name: Compile critical modules
        working-directory: backend
        run: python -m compileall -q app/contracts app/cognition app/integration app/indexing app/lexical app/research app/retrieval app/synthesis app/taskpack app/api/index.py app/api/synthesis.py app/api/research_os.py app/api/dossiers.py app/api/increment_analysis.py app/api/topic_candidates.py app/api/return_candidates.py app/main.py
      - name: Run contract and retrieval tests
        working-directory: backend
        run: python -m pytest tests/test_i8_research_os_integration.py tests/test_i8_phase2_workflow.py tests/test_fts_search.py tests/test_fts_prefilter.py tests/test_retrieval_feedback.py tests/test_docid_policy.py tests/test_p8_reconcile_determinism.py tests/test_dl01_foundation.py tests/test_dl01_catalog_pipeline.py tests/test_dl01_cognition_catalog.py tests/test_dl01_cognition_vector_sync.py tests/test_dl01_semantic_recovery.py tests/test_dl01_no_semantic_process_smoke.py tests/test_dl02_topic_dossier.py tests/test_dl03_research_context_pack.py tests/test_dl04_increment_candidates.py tests/test_dl06_return_candidates.py tests/test_dl06_return_protocol.py tests/test_dl06_formal_cognition_adapter.py tests/synthesis/test_schemas.py tests/synthesis/test_validator.py tests/synthesis/test_epistemic_linter.py tests/taskpack/test_context_expansion.py tests/taskpack/test_validation_cache.py tests/taskpack/test_external_worker_launcher.py tests/taskpack/test_dl05_gap_candidates.py tests/taskpack/test_dl05c_topic_card_policy.py -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: DL-06D return-candidate action policy
        run: npm run test:dl06d
      - run: npm run build

  powershell-syntax:
    name: Runtime PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all runtime scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path runtime -Filter *.ps1 -File
          if (-not $files) { throw 'No runtime PowerShell scripts found' }
          foreach ($file in $files) {
            Write-Host "Parsing $($file.FullName)"
            [void][scriptblock]::Create((Get-Content -Raw -Encoding UTF8 $file.FullName))
          }
