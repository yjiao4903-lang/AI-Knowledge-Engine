services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: ai-kb-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # Windows 下不使用 bind mount，官方推荐 Named Volume
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
